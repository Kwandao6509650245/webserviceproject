<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nail Salon - Book Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Book a Nail Appointment</h1>

    <div id="slots"></div>

        <button type="submit">Book Appointment</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
