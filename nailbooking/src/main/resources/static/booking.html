<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Nail Salon Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #ffe6f0, #ffe6fa);
            margin: 0;
            padding: 2rem;
            color: #333;
        }

        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.2);
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            border: 3px solid #fbd6e8;
        }

        h1 {
            text-align: center;
            color: #d63384;
            margin-bottom: 0.2rem;
        }

        h2 {
            text-align: center;
            color: #666;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 1.5rem;
            color: #d63384;
            width: 100%;
        }

        input,
        select {
            width: 100%;
            padding: 0.7rem;
            margin-top: 0.5rem;
            border-radius: 10px;
            border: 1px solid #f2c2dc;
            background-color: #fff5fa;
            font-size: 1rem;
        }

        input#customerName {
            box-sizing: border-box;
            width: 100%;
        }

        button {
            margin-top: 1.8rem;
            width: 100%;
            padding: 0.9rem;
            background-color: #fcbde0;
            color: #d63384;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #f89fce;
        }

        .emoji-label {
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💅 Nail Salon Booking</h1>
        <h2>📅 Book your time slot for beautiful nails!</h2>

        <label for="customerName" class="emoji-label">🙋 Your Name:</label>
        <input type="text" id="customerName" placeholder="Enter your name" />

        <label for="slot" class="emoji-label">⏰ Select a Time Slot:</label>
        <select id="slot">
            <option value="">-- Choose a time slot --</option>
        </select>

        <button onclick="bookAppointment()">📌 Confirm Appointment</button>
    </div>
</body>

</html>


<script>
    const baseUrl = 'http://localhost:8081/api';

    // ฟังก์ชันแปลงเวลาให้เป็นรูปแบบ "yyyy-MM-dd'T'HH:mm:ss"
    function formatReadableDate(date) {
        const options = {
            year: 'numeric',
            month: 'short',   // May
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true      // เพื่อให้ได้รูปแบบ AM/PM
        };
        return date.toLocaleString('en-US', options);
    }

    // โหลดวันว่างจากฝั่ง BookingService ผ่าน ServiceService
    async function loadSlots() {
        try {
            const res = await fetch(`${baseUrl}/available-slots`);
            if (!res.ok) {
                throw new Error('Failed to load available slots');
            }
            const slots = await res.json();

            const slotSelect = document.getElementById('slot');
            slots.forEach(slot => {
                const option = document.createElement('option');
                option.value = slot; // ค่านี้จะถูกใช้ตอนส่งข้อมูล
                option.textContent = formatReadableDate(new Date(slot)); // แสดงแบบอ่านง่าย
                slotSelect.appendChild(option);
            });
        } catch (error) {
            alert('Error loading available slots: ' + error.message);
        }
    }


    async function bookAppointment() {
        const customerName = document.getElementById('customerName').value;
        const slot = document.getElementById('slot').value;
        console.log("Customer Name:", customerName);
        console.log("Selected Slot:", slot);

        if (!customerName || !slot) {
            alert('Please enter your name and select a time slot.');
            return;
        }

        const body = {
            name: customerName, // ส่งชื่อผู้ใช้
            time: slot          // ส่งเวลาในรูปแบบที่ตรงกับ LocalDateTime
        };

        const res = await fetch(`${baseUrl}/book-appointment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            alert('Appointment booked successfully!');
            document.getElementById('customerName').value = '';
            window.location.reload();
        } else {
            alert('Error booking appointment.');
        }
    }

    loadSlots();
</script>

</body>

</html>
