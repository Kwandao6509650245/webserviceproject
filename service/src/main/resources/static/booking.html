<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Appointment</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h2 {
            color: #e48db1;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 1.5rem;
            padding: 0.7rem;
            width: 100%;
            background-color: #e48db1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #d6719e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Book Your Appointment</h2>

        <label for="customerName">Your Name:</label>
        <input type="text" id="customerName" placeholder="Enter your name" />

        <label for="slot">Select Available Slot:</label>
        <select id="slot">
            <option value="">-- Select a time slot --</option>
        </select>

        <button onclick="bookAppointment()">Book</button>
    </div>

    <script>
        const baseUrl = 'http://localhost:8081/api';

        // ฟังก์ชันแปลงเวลาให้เป็นรูปแบบ "yyyy-MM-dd'T'HH:mm:ss"
        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0'); // เดือนต้องเพิ่ม 1 เพราะ index ของเดือนเริ่มจาก 0
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');

            return `${year}-${month}-${day}T${hours}:${minutes}:00`; // คืนค่ารูปแบบที่ตรงกับ LocalDateTime
        }

        // โหลดวันว่างจากฝั่ง BookingService ผ่าน ServiceService
        async function loadSlots() {
            try {
                const res = await fetch(`${baseUrl}/available-slots`);
                if (!res.ok) {
                    throw new Error('Failed to load available slots');
                }
                const slots = await res.json();

                const slotSelect = document.getElementById('slot');
                slots.forEach(slot => {
                    const option = document.createElement('option');
                    option.value = slot;
                    option.textContent = formatDate(new Date(slot));
                    slotSelect.appendChild(option);
                });
            } catch (error) {
                alert('Error loading available slots: ' + error.message);
            }

        }

        async function bookAppointment() {
            const customerName = document.getElementById('customerName').value;
            const slot = document.getElementById('slot').value;
            console.log("Customer Name:", customerName);
            console.log("Selected Slot:", slot);

            if (!customerName || !slot) {
                alert('Please enter your name and select a time slot.');
                return;
            }

            const body = {
                name: customerName, // ส่งชื่อผู้ใช้
                time: slot          // ส่งเวลาในรูปแบบที่ตรงกับ LocalDateTime
            };

            const res = await fetch(`${baseUrl}/book-appointment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                alert('Appointment booked successfully!');
                document.getElementById('customerName').value = '';
                window.location.reload();
            } else {
                alert('Error booking appointment.');
            }
        }

        loadSlots();
    </script>

</body>

</html>
