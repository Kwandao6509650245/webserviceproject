<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nail Salon Services & Rating</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #fff0f8, #ffe6f5);
            padding: 2rem;
            margin: 0;
            color: #333;
        }

        h1,
        h2 {
            color: #d63384;
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
        }

        #services {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 20px;
            padding-bottom: 1rem;
            max-width: 60%;
            margin: 2rem auto 0;
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        #services::-webkit-scrollbar {
            height: 8px;
        }

        #services::-webkit-scrollbar-track {
            background: #ffe6f5;
            border-radius: 10px;
        }

        #services::-webkit-scrollbar-thumb {
            background-color: #d63384;
            border-radius: 10px;
            border: 2px solid #ffe6f5;
        }

        .service-card {
            flex: 0 0 auto;
            width: 300px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 16px 24px rgba(214, 51, 132, 0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .card {
            padding: 2rem;
        }

        .card-title {
            font-size: 1.3rem;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .card-text {
            font-size: 1rem;
            color: #555;
            word-wrap: break-word;
            white-space: normal;
        }

        .rating-box {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            max-width: 60%;
            margin: 3rem auto;
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.1);
            border: 2px solid #fcd6e9;
        }

        label {
            font-weight: bold;
            color: #d63384;
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.4rem;
        }

        select,
        input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 10px;
            border: 1px solid #f2c2dc;
            background-color: #fff5fa;
            font-size: 1rem;
        }

        input::placeholder {
            color: #bbb;
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.9rem;
            background-color: #fcbde0;
            color: #d63384;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #f89fce;
        }
    </style>
</head>

<body>
    <h1>💅 Welcome to Our Nail Salon</h1>

    <h2>✨ Our Services</h2>
    <div id="services"></div>

    <div class="rating-box">
        <h2>📝 Rate Our Salon</h2>
        <label for="rating">⭐ Your Rating:</label>
        <select id="rating">
            <option value="">-- Select Rating --</option>
            <option value="1">1 ⭐</option>
            <option value="2">2 ⭐</option>
            <option value="3">3 ⭐</option>
            <option value="4">4 ⭐</option>
            <option value="5">5 ⭐</option>
        </select>

        <label for="comment">💬 Comment:</label>
        <input type="text" id="comment" placeholder="Write your feedback..." />

        <button onclick="submitShopRating()">📨 Submit Rating</button>
    </div>

    <script>
        const baseUrl = 'http://localhost:8081/api';

        async function loadServices() {
            try {
                const res = await fetch(`${baseUrl}/services`);
                const services = await res.json();

                const container = document.getElementById('services');
                container.innerHTML = '';

                services.forEach(service => {
                    const div = document.createElement('div');
                    div.className = 'service-card';
                    div.innerHTML = `
                        <div class="card">
                            <div class="card-title">${service.name}</div>
                            <div class="card-text">${service.description}</div>
                            <div><strong>Price:</strong> ฿${service.price ? service.price.toFixed(2) : 'N/A'}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('services').innerHTML = '<p style="color:red;">Error loading services.</p>';
            }
        }

        async function submitShopRating() {
            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('comment').value;

            if (!rating) {
                alert('Please select a rating.');
                return;
            }

            const body = {
                ratingValue: parseInt(rating),
                review: comment
            };

            const res = await fetch('/api/rate-service', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                alert('Thank you for rating our salon!');
                document.getElementById('rating').value = '';
                document.getElementById('comment').value = '';
            } else {
                alert('Error submitting rating.');
            }
        }

        loadServices();
    </script>
</body>

</html>
