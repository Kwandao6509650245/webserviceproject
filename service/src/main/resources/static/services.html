<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Nail Salon Services & Rating</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            padding: 2rem;
        }

        h1,
        h2 {
            color: #e48db1;
        }

        .service {
            background: white;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .rating-box {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            max-width: 500px;
            margin: 2rem auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #e48db1;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #d46b94;
        }

        #services {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-around;
        }

        .service-card {
            width: 300px;
            /* กำหนดความกว้างของ card */
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            background-color: white;
        }

        .card {
            padding: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: 1rem;
            margin-bottom: 15px;
        }

        strong {
            font-weight: bold;
        }

        .card-body {
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>Welcome to Our Nail Salon</h1>

    <h2>Our Services</h2>
    <div id="services">Loading services...</div>

    <div class="rating-box">
        <h2>Rate Our Salon</h2>
        <label for="rating">Your Rating:</label>
        <select id="rating">
            <option value="">-- Select Rating --</option>
            <option value="1">1 ⭐</option>
            <option value="2">2 ⭐</option>
            <option value="3">3 ⭐</option>
            <option value="4">4 ⭐</option>
            <option value="5">5 ⭐</option>
        </select>

        <label for="comment">Comment:</label>
        <input type="text" id="comment" placeholder="Write your feedback..." />

        <button onclick="submitShopRating()">Submit Rating</button>
    </div>

    <script>
        const baseUrl = 'http://localhost:8081/api';

        async function loadServices() {
            try {
                const res = await fetch(`${baseUrl}/services`);
                const services = await res.json();

                const container = document.getElementById('services');
                container.innerHTML = ''; // Clear previous content

                services.forEach(service => {
                    const div = document.createElement('div');
                    div.className = 'service-card'; // Add card class for styling
                    div.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">${service.name}</h5>
                        <p class="card-text">${service.description}</p>
                        <strong>Price:</strong> ฿${service.price ? service.price.toFixed(2) : 'N/A'}
                    </div>
                </div>
            `;
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('services').innerHTML = '<p style="color:red;">Error loading services.</p>';
            }
        }


        async function submitShopRating() {
            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('comment').value;

            if (!rating) {
                alert('Please select a rating.');
                return;
            }

            const body = {
                ratingValue: parseInt(rating),
                review: comment
            };

            const res = await fetch('/api/rate-service', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                alert('Thank you for rating our salon!');
                document.getElementById('rating').value = '';
                document.getElementById('comment').value = '';
            } else {
                alert('Error submitting rating.');
            }
        }

        loadServices();
    </script>
</body>

</html>
